name: Verify artifact

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild derived results
        run: |
          python3 -B scripts/build_analysis.py
          python3 -B scripts/build_reliable_repairs.py
      - name: Run tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Audit release contents
        run: python3 -B scripts/verify_release.py
      - name: Confirm deterministic checked-in results
        run: git diff --exit-code
